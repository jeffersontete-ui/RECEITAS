<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Galeria de carimbos — prévia</title>
<link rel="stylesheet" href="assets/css/carimbos.css">
<style>
body{font-family:Inter,Arial,sans-serif;background:#f4f7f9;color:#16324a;margin:0;padding:24px}
h1{font-size:20px;margin:0 0 4px}p.sub{color:#5b7285;margin:0 0 20px;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item{background:#fff;border:1px solid #dbe6ec;border-radius:12px;padding:16px;text-align:center}
.item .prev{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:13px}
.item .nm{font-size:11px;color:#6b8296;margin-top:10px;font-weight:600}
</style></head><body>
<h1>Galeria de carimbos — 28 modelos</h1>
<p class="sub">Esta é apenas uma página de conferência. Na aba <b>Carimbo &amp; Fontes</b> os modelos aparecem clicáveis e com o texto editável.</p>
<div class="grid" id="g"></div>
<script src="assets/js/carimbos.js"></script>
<script>
Carimbos.injectFonts();
var d={l1:"Dra. Ana Souza Lima",l2:"Médica Cardiologista",l3:"CRM-MG 000000",l4:""};
document.getElementById("g").innerHTML=Carimbos.modelos.map(function(m){
  return '<div class="item"><div class="prev">'+Carimbos.build(m.id,d,null,1)+'</div><div class="nm">'+m.nome+'</div></div>';
}).join("");
</script></body></html>
